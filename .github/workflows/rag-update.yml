name: rag-update

on:
  workflow_dispatch:
  push:
    paths:
      - 'documents/**'
      - 'rag/metadata.jsonl'
      - 'rag/chunks.jsonl'
      - '.github/workflows/rag-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build updater
        run: go build -o /tmp/rag-update ./cmd/rag-update
      - name: Update runtime RAG data
        run: /tmp/rag-update
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/restaurants.json
          git diff --cached --quiet || git commit -m 'chore: update RAG runtime data'
          git push
